<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9C6B3C"/><stop offset="1" stop-color="#875A2F"/>
    </linearGradient>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0,-10 C1.4,-3 3,-1.4 10,0 C3,1.4 1.4,3 0,10 C-1.4,3 -3,1.4 -10,0 C-3,-1.4 -1.4,-3 0,-10 Z" fill="#FFFFFF"/>
    </symbol>
  </defs>

  <rect width="1280" height="800" fill="#FBF8F2"/>
  <!-- browser chrome -->
  <rect width="1280" height="64" fill="#E9E3D6"/>
  <circle cx="30" cy="32" r="6" fill="#B4452F"/>
  <circle cx="52" cy="32" r="6" fill="#B07D2B"/>
  <circle cx="74" cy="32" r="6" fill="#4E7A4A"/>
  <path d="M104 64 L104 22 a8 8 0 0 1 8 -8 h260 a8 8 0 0 1 8 8 V64 Z" fill="#FBF8F2"/>
  <circle cx="128" cy="32" r="6" fill="#9C6B3C"/>
  <text x="144" y="37" font-size="13" fill="#2B2620">Nature — Research article</text>
  <rect x="392" y="18" width="700" height="28" rx="14" fill="#FFFFFF" stroke="#D9CBB0"/>
  <text x="410" y="37" font-size="12" fill="#6B6155">https://nature.example.com/quantum-coherence</text>
  <rect x="1208" y="20" width="44" height="24" rx="6" fill="url(#chip)"/>
  <text x="1230" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF8EE">L</text>

  <!-- dimmed article behind drawer -->
  <rect y="64" width="1280" height="736" fill="#2B2620" opacity="0.28"/>

  <!-- ===== SETTINGS DRAWER (right, 480) ===== -->
  <g transform="translate(800,64)">
    <rect width="480" height="736" fill="#FBF8F2"/>
    <rect width="480" height="56" fill="#F8F0E2"/>
    <text x="24" y="35" font-size="17" font-weight="700" fill="#2B2620">Settings</text>
    <g transform="translate(432,16)" fill="none" stroke="#6B6155" stroke-width="2">
      <path d="M4 4 L20 20 M20 4 L4 20"/>
    </g>

    <!-- Provider section -->
    <g transform="translate(24,84)">
      <text font-size="12" font-weight="700" fill="#9A8E7A" letter-spacing="1.5">AI PROVIDER · BRING YOUR OWN KEY</text>

      <!-- provider grid -->
      <g transform="translate(0,24)" font-size="12" font-weight="600">
        <rect width="130" height="44" rx="10" fill="url(#chip)"/><text x="65" y="28" text-anchor="middle" fill="#FFF8EE">DeepSeek ✓</text>
        <rect x="138" width="130" height="44" rx="10" fill="#FFFFFF" stroke="#D9CBB0"/><text x="203" y="28" text-anchor="middle" fill="#2B2620">OpenAI</text>
        <rect x="276" width="130" height="44" rx="10" fill="#FFFFFF" stroke="#D9CBB0"/><text x="341" y="28" text-anchor="middle" fill="#2B2620">Anthropic</text>
        <rect y="52" width="130" height="44" rx="10" fill="#FFFFFF" stroke="#D9CBB0"/><text x="65" y="80" text-anchor="middle" fill="#2B2620">OpenRouter</text>
        <rect x="138" y="52" width="130" height="44" rx="10" fill="#FFFFFF" stroke="#D9CBB0"/><text x="203" y="80" text-anchor="middle" fill="#2B2620">通义千问</text>
        <rect x="276" y="52" width="130" height="44" rx="10" fill="#FFFFFF" stroke="#D9CBB0"/><text x="341" y="80" text-anchor="middle" fill="#2B2620">智谱 GLM</text>
        <rect y="104" width="406" height="44" rx="10" fill="#FFFFFF" stroke="#D9CBB0"/><text x="20" y="132" fill="#2B2620">+ 16 more · Custom host (Ollama / vLLM / LM Studio…)</text>
      </g>
    </g>

    <!-- API key field -->
    <g transform="translate(24,280)">
      <text font-size="12" font-weight="600" fill="#6B6155">API Key</text>
      <rect y="10" width="432" height="44" rx="10" fill="#FFFFFF" stroke="#D9CBB0"/>
      <text x="16" y="38" font-size="14" fill="#2B2620" font-family="SF Mono, Menlo, monospace">sk-••••••••••••••••••••••••3f2a</text>
      <text x="384" y="38" font-size="12" fill="#9A8E7A">Show</text>
    </g>

    <!-- model select -->
    <g transform="translate(24,360)">
      <text font-size="12" font-weight="600" fill="#6B6155">Model</text>
      <rect y="10" width="318" height="44" rx="10" fill="#FFFFFF" stroke="#D9CBB0"/>
      <text x="16" y="38" font-size="14" fill="#2B2620">deepseek-chat</text>
      <path d="M300 28 l8 8 8 -8" stroke="#9A8E7A" stroke-width="1.6" fill="none"/>
      <rect x="326" y="10" width="106" height="44" rx="10" fill="#F2E6D2"/>
      <text x="379" y="37" text-anchor="middle" font-size="12" font-weight="600" fill="#875A2F">⬇ 拉取模型</text>
    </g>

    <!-- test connection -->
    <g transform="translate(24,440)">
      <rect width="432" height="48" rx="12" fill="#EDF3EB" stroke="#4E7A4A" stroke-width="1.5"/>
      <circle cx="28" cy="24" r="9" fill="#4E7A4A"/>
      <path d="M23 24 l4 4 l7 -8" stroke="#FFF8EE" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="30" font-size="14" font-weight="600" fill="#4E7A4A">Connection OK · 200 ms · 14 models available</text>
    </g>

    <!-- privacy note -->
    <g transform="translate(24,520)">
      <rect width="432" height="80" rx="12" fill="#F8F0E2"/>
      <g transform="translate(16,20)" fill="none" stroke="#875A2F" stroke-width="1.8">
        <rect x="0" y="0" width="24" height="28" rx="4"/>
        <path d="M5 0 V-6 a7 7 0 0 1 14 0 V0" transform="translate(0,4)"/>
      </g>
      <text x="52" y="34" font-size="13" font-weight="600" fill="#2B2620">Your key never leaves your browser.</text>
      <text x="52" y="54" font-size="12" fill="#6B6155">Stored in chrome.storage.local; sent only to your</text>
      <text x="52" y="70" font-size="12" fill="#6B6155">chosen provider. No Lector server, no signup.</text>
    </g>

    <!-- done button -->
    <g transform="translate(24,636)">
      <rect width="432" height="56" rx="14" fill="url(#chip)"/>
      <text x="216" y="35" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF8EE">Done</text>
    </g>
  </g>

  <!-- caption -->
  <g transform="translate(40,748)">
    <rect width="372" height="36" rx="18" fill="#2B2620"/>
    <use href="#spark" x="16" y="8" width="20" height="20"/>
    <text x="46" y="23" font-size="13.5" font-weight="600" fill="#FFF8EE">Bring your own key — 19 presets, no signup</text>
  </g>
</svg>
