<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9C6B3C"/><stop offset="1" stop-color="#875A2F"/>
    </linearGradient>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0,-10 C1.4,-3 3,-1.4 10,0 C3,1.4 1.4,3 0,10 C-1.4,3 -3,1.4 -10,0 C-3,-1.4 -1.4,-3 0,-10 Z" fill="#FFFFFF"/>
    </symbol>
  </defs>

  <!-- Browser chrome -->
  <rect width="1280" height="800" fill="#FBF8F2"/>
  <rect width="1280" height="64" fill="#E9E3D6"/>
  <circle cx="30" cy="32" r="6" fill="#B4452F"/>
  <circle cx="52" cy="32" r="6" fill="#B07D2B"/>
  <circle cx="74" cy="32" r="6" fill="#4E7A4A"/>
  <!-- tab -->
  <path d="M104 64 L104 22 a8 8 0 0 1 8 -8 h260 a8 8 0 0 1 8 8 V64 Z" fill="#FBF8F2"/>
  <circle cx="128" cy="32" r="6" fill="#9C6B3C"/>
  <text x="144" y="37" font-size="13" fill="#2B2620">The Future of Reading — Long-form Essay</text>
  <!-- url bar -->
  <rect x="392" y="18" width="700" height="28" rx="14" fill="#FFFFFF" stroke="#D9CBB0"/>
  <text x="410" y="37" font-size="12" fill="#6B6155">https://essays.example.com/the-future-of-reading</text>
  <!-- toolbar icons -->
  <circle cx="1120" cy="32" r="8" fill="none" stroke="#9A8E7A" stroke-width="1.5"/>
  <rect x="1148" y="24" width="16" height="16" rx="3" fill="none" stroke="#9A8E7A" stroke-width="1.5"/>
  <rect x="1208" y="20" width="44" height="24" rx="6" fill="url(#chip)"/>
  <text x="1230" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF8EE">L</text>

  <!-- ===== ARTICLE COLUMN (left) ===== -->
  <g transform="translate(0,64)">
    <rect width="880" height="736" fill="#FFFFFF"/>
    <g transform="translate(64,56)">
      <text font-size="15" font-weight="700" fill="#9C6B3C" letter-spacing="2">ESSAY · TECHNOLOGY</text>
      <text y="52" font-size="40" font-weight="700" fill="#2B2620">The Future of Reading</text>
      <text y="82" font-size="17" fill="#6B6155">How attention, design, and AI are reshaping the long form.</text>

      <!-- article body lines -->
      <g transform="translate(0,130)" fill="#2B2620">
        <rect width="690" height="9" rx="4.5" opacity="0.85"/>
        <rect y="20" width="710" height="9" rx="4.5" opacity="0.55"/>
        <rect y="40" width="660" height="9" rx="4.5" opacity="0.55"/>
        <rect y="60" width="700" height="9" rx="4.5" opacity="0.85"/>
        <rect y="80" width="520" height="9" rx="4.5" opacity="0.55"/>

        <rect y="116" width="710" height="9" rx="4.5" opacity="0.85"/>
        <rect y="136" width="690" height="9" rx="4.5" opacity="0.55"/>
        <rect y="156" width="700" height="9" rx="4.5" opacity="0.85"/>
        <rect y="176" width="600" height="9" rx="4.5" opacity="0.55"/>

        <!-- highlighted sentence -->
        <rect x="-8" y="204" width="726" height="30" rx="6" fill="#F2E6D2"/>
        <rect y="213" width="690" height="9" rx="4.5" fill="#875A2F"/>

        <rect y="252" width="710" height="9" rx="4.5" opacity="0.55"/>
        <rect y="272" width="640" height="9" rx="4.5" opacity="0.55"/>
        <rect y="292" width="700" height="9" rx="4.5" opacity="0.85"/>
        <rect y="312" width="560" height="9" rx="4.5" opacity="0.55"/>

        <rect y="348" width="700" height="9" rx="4.5" opacity="0.85"/>
        <rect y="368" width="680" height="9" rx="4.5" opacity="0.55"/>
        <rect y="388" width="520" height="9" rx="4.5" opacity="0.55"/>
      </g>
    </g>
  </g>

  <!-- ===== SIDE PANEL (right, 400px) ===== -->
  <g transform="translate(880,64)">
    <rect width="400" height="736" fill="#FBF8F2" stroke="#E8DECC" stroke-width="1"/>
    <!-- panel header -->
    <rect width="400" height="56" fill="#F8F0E2"/>
    <rect x="16" y="16" width="36" height="24" rx="8" fill="url(#chip)"/>
    <text x="34" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF8EE">L</text>
    <text x="62" y="35" font-size="15" font-weight="700" fill="#2B2620">Lector AI</text>
    <!-- header icons -->
    <g transform="translate(296,18)" fill="none" stroke="#6B6155" stroke-width="1.6">
      <rect x="0" y="0" width="20" height="20" rx="5"/>
      <path d="M5 8 h10 M5 12 h7"/>
    </g>
    <g transform="translate(330,18)" fill="none" stroke="#6B6155" stroke-width="1.6">
      <circle cx="10" cy="10" r="9"/>
      <path d="M10 5 v5 l3 2"/>
    </g>
    <g transform="translate(364,18)">
      <circle cx="10" cy="10" r="10" fill="none" stroke="#6B6155" stroke-width="1.6"/>
      <circle cx="10" cy="8" r="3.4" fill="none" stroke="#6B6155" stroke-width="1.6"/>
    </g>

    <!-- tab strip -->
    <rect width="400" height="40" fill="#FBF8F2"/>
    <rect x="16" y="0" width="92" height="40" fill="none"/>
    <text x="62" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#2B2620">Chat</text>
    <rect x="62" y="36" width="28" height="2.5" rx="1.25" fill="#9C6B3C"/>
    <text x="158" y="25" text-anchor="middle" font-size="13" fill="#9A8E7A">Translate</text>
    <text x="254" y="25" text-anchor="middle" font-size="13" fill="#9A8E7A">Sentences</text>
    <text x="350" y="25" text-anchor="middle" font-size="13" fill="#9A8E7A">Cards</text>

    <!-- user bubble -->
    <g transform="translate(24,116)">
      <rect width="270" height="44" rx="11" fill="#F2E6D2"/>
      <text x="16" y="27" font-size="13.5" fill="#2B2620">Summarize this article in 3 bullets</text>
    </g>

    <!-- assistant reply -->
    <g transform="translate(24,180)">
      <rect width="352" height="250" rx="12" fill="#FFFFFF" stroke="#E8DECC"/>
      <g transform="translate(18,22)" fill="#2B2620">
        <!-- bullet 1 -->
        <circle cx="4" cy="4" r="3" fill="#9C6B3C"/>
        <text x="16" y="8" font-size="13" font-weight="600">Reading is shifting from scanning to dialogue.</text>
        <rect x="16" y="20" width="300" height="6.5" rx="3" opacity="0.45"/>
        <rect x="16" y="32" width="270" height="6.5" rx="3" opacity="0.45"/>
        <!-- bullet 2 -->
        <circle cx="4" cy="62" r="3" fill="#9C6B3C"/>
        <text x="16" y="66" font-size="13" font-weight="600">Design must respect attention, not exploit it.</text>
        <rect x="16" y="78" width="300" height="6.5" rx="3" opacity="0.45"/>
        <!-- bullet 3 -->
        <circle cx="4" cy="104" r="3" fill="#9C6B3C"/>
        <text x="16" y="108" font-size="13" font-weight="600">AI becomes a reading companion by your side.</text>
        <rect x="16" y="120" width="280" height="6.5" rx="3" opacity="0.45"/>
        <rect x="16" y="132" width="250" height="6.5" rx="3" opacity="0.45"/>
        <!-- citation chips -->
        <rect x="0" y="156" width="120" height="22" rx="11" fill="#F8F0E2"/>
        <text x="60" y="171" text-anchor="middle" font-size="11" font-weight="600" fill="#875A2F">¶ 2 · citation</text>
        <rect x="128" y="156" width="120" height="22" rx="11" fill="#F8F0E2"/>
        <text x="188" y="171" text-anchor="middle" font-size="11" font-weight="600" fill="#875A2F">¶ 5 · citation</text>
      </g>
    </g>

    <!-- input bar -->
    <g transform="translate(24,470)">
      <rect width="352" height="56" rx="14" fill="#FFFFFF" stroke="#D9CBB0"/>
      <text x="18" y="33" font-size="13" fill="#9A8E7A">Ask anything about this page…</text>
      <circle cx="312" cy="28" r="16" fill="#9C6B3C"/>
      <path d="M305 28 h14 M312 21 v14" stroke="#FFF8EE" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- tool quick row -->
    <g transform="translate(24,548)" font-size="12" font-weight="600">
      <rect width="84" height="32" rx="8" fill="#F5EFE3"/><text x="42" y="21" text-anchor="middle" fill="#875A2F">Explain</text>
      <rect x="92" y="0" width="84" height="32" rx="8" fill="#F5EFE3"/><text x="134" y="21" text-anchor="middle" fill="#875A2F">Translate</text>
      <rect x="184" y="0" width="84" height="32" rx="8" fill="#F5EFE3"/><text x="226" y="21" text-anchor="middle" fill="#875A2F">Summarize</text>
      <rect x="276" y="0" width="76" height="32" rx="8" fill="#F5EFE3"/><text x="314" y="21" text-anchor="middle" fill="#875A2F">Ask…</text>
    </g>
  </g>

  <!-- caption tag -->
  <g transform="translate(40,748)">
    <rect width="360" height="36" rx="18" fill="#2B2620"/>
    <use href="#spark" x="16" y="8" width="20" height="20"/>
    <text x="46" y="23" font-size="13.5" font-weight="600" fill="#FFF8EE">Chat with any article — streamed, cited answers</text>
  </g>
</svg>
