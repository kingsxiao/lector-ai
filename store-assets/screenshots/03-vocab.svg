<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9C6B3C"/><stop offset="1" stop-color="#875A2F"/>
    </linearGradient>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <path d="M0,-10 C1.4,-3 3,-1.4 10,0 C3,1.4 1.4,3 0,10 C-1.4,3 -3,1.4 -10,0 C-3,-1.4 -1.4,-3 0,-10 Z" fill="#FFFFFF"/>
    </symbol>
  </defs>

  <rect width="1280" height="800" fill="#FBF8F2"/>
  <!-- browser chrome -->
  <rect width="1280" height="64" fill="#E9E3D6"/>
  <circle cx="30" cy="32" r="6" fill="#B4452F"/>
  <circle cx="52" cy="32" r="6" fill="#B07D2B"/>
  <circle cx="74" cy="32" r="6" fill="#4E7A4A"/>
  <path d="M104 64 L104 22 a8 8 0 0 1 8 -8 h300 a8 8 0 0 1 8 8 V64 Z" fill="#FBF8F2"/>
  <circle cx="128" cy="32" r="6" fill="#9C6B3C"/>
  <text x="144" y="37" font-size="13" fill="#2B2620">Linguistics Today — Lexical drift</text>
  <rect x="392" y="18" width="700" height="28" rx="14" fill="#FFFFFF" stroke="#D9CBB0"/>
  <text x="410" y="37" font-size="12" fill="#6B6155">https://linguistics.example.org/semantic-shift</text>
  <rect x="1208" y="20" width="44" height="24" rx="6" fill="url(#chip)"/>
  <text x="1230" y="36" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF8EE">L</text>

  <!-- ===== ARTICLE (left ~880) ===== -->
  <g transform="translate(0,64)">
    <rect width="880" height="736" fill="#FFFFFF"/>
    <g transform="translate(64,52)">
      <text font-size="13" font-weight="700" fill="#9C6B3C" letter-spacing="2">LINGUISTICS</text>
      <text y="46" font-size="34" font-weight="700" fill="#2B2620">The Quiet Drift of Meaning</text>
      <g transform="translate(0,92)" fill="#2B2620">
        <rect width="700" height="9" rx="4.5" opacity="0.85"/>
        <rect y="20" width="720" height="9" rx="4.5" opacity="0.5"/>
        <rect y="40" width="680" height="9" rx="4.5" opacity="0.5"/>
        <rect y="60" width="700" height="9" rx="4.5" opacity="0.85"/>

        <!-- selected word with highlight -->
        <rect x="-6" y="92" width="830" height="30" rx="6" fill="#F2E6D2"/>
        <rect x="-6" y="92" width="150" height="30" rx="6" fill="#9C6B3C" opacity="0.25"/>
        <text x="0" y="112" font-size="16" font-weight="700" fill="#875A2F">etymology</text>
        <rect x="150" y="104" width="600" height="9" rx="4.5" opacity="0.55"/>

        <rect y="140" width="700" height="9" rx="4.5" opacity="0.5"/>
        <rect y="160" width="640" height="9" rx="4.5" opacity="0.5"/>
        <rect y="180" width="700" height="9" rx="4.5" opacity="0.85"/>
        <rect y="200" width="560" height="9" rx="4.5" opacity="0.5"/>
        <rect y="236" width="700" height="9" rx="4.5" opacity="0.5"/>
        <rect y="256" width="620" height="9" rx="4.5" opacity="0.5"/>
        <rect y="276" width="680" height="9" rx="4.5" opacity="0.85"/>
        <rect y="296" width="520" height="9" rx="4.5" opacity="0.5"/>
      </g>
    </g>

    <!-- selection toolbar floating above the word -->
    <g transform="translate(58,200)">
      <rect width="300" height="44" rx="12" fill="#FFFFFF" stroke="#D9CBB0"/>
      <rect x="0" y="0" width="300" height="44" rx="12" fill="#FFFFFF" filter="url(#none)"/>
      <g transform="translate(12,10)" font-size="12" font-weight="600">
        <rect width="64" height="24" rx="8" fill="#9C6B3C"/><text x="32" y="16" text-anchor="middle" fill="#FFF8EE">Explain</text>
        <rect x="72" width="68" height="24" rx="8" fill="#F5EFE3"/><text x="106" y="16" text-anchor="middle" fill="#875A2F">Translate</text>
        <rect x="148" width="56" height="24" rx="8" fill="#F5EFE3"/><text x="176" y="16" text-anchor="middle" fill="#875A2F">Save</text>
        <rect x="212" width="64" height="24" rx="8" fill="#F5EFE3"/><text x="244" y="16" text-anchor="middle" fill="#875A2F">Card</text>
      </g>
    </g>
  </g>

  <!-- ===== SIDE PANEL: Sentences/Cards (right 400) ===== -->
  <g transform="translate(880,64)">
    <rect width="400" height="736" fill="#FBF8F2" stroke="#E8DECC"/>
    <rect width="400" height="56" fill="#F8F0E2"/>
    <rect x="16" y="16" width="36" height="24" rx="8" fill="url(#chip)"/>
    <text x="34" y="33" text-anchor="middle" font-size="13" font-weight="700" fill="#FFF8EE">L</text>
    <text x="62" y="35" font-size="15" font-weight="700" fill="#2B2620">Lector AI</text>

    <!-- tabs -->
    <rect width="400" height="40" fill="#FBF8F2"/>
    <text x="62" y="25" text-anchor="middle" font-size="13" fill="#9A8E7A">Chat</text>
    <text x="158" y="25" text-anchor="middle" font-size="13" fill="#9A8E7A">Translate</text>
    <text x="254" y="25" text-anchor="middle" font-size="13" font-weight="600" fill="#2B2620">Cards</text>
    <rect x="240" y="36" width="28" height="2.5" rx="1.25" fill="#9C6B3C"/>
    <text x="350" y="25" text-anchor="middle" font-size="13" fill="#9A8E7A">Library</text>

    <!-- sentence card -->
    <g transform="translate(20,72)">
      <rect width="360" height="232" rx="14" fill="#FFFFFF" stroke="#E8DECC"/>
      <rect x="0" y="0" width="360" height="40" rx="14" fill="#F8F0E2"/>
      <rect x="0" y="26" width="360" height="14" fill="#F8F0E2"/>
      <text x="16" y="26" font-size="14" font-weight="700" fill="#875A2F">etymology</text>
      <!-- pos + cefr badges -->
      <rect x="270" y="12" width="34" height="20" rx="10" fill="#EAF1FB"/><text x="287" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#2B5FA8">noun</text>
      <rect x="310" y="12" width="34" height="20" rx="10" fill="#EDF3EB"/><text x="327" y="26" text-anchor="middle" font-size="10" font-weight="700" fill="#4E7A4A">C1</text>

      <!-- pronunciation -->
      <text x="16" y="66" font-size="13" fill="#6B6155">/ˌetɪˈmɒlədʒi/  · n. 词源(学)</text>

      <!-- definition -->
      <text x="16" y="92" font-size="12" font-weight="600" fill="#9A8E7A" letter-spacing="1">DEFINITION</text>
      <rect x="16" y="100" width="300" height="6.5" rx="3" fill="#2B2620" opacity="0.8"/>
      <rect x="16" y="112" width="270" height="6.5" rx="3" fill="#2B2620" opacity="0.5"/>

      <!-- example -->
      <text x="16" y="138" font-size="12" font-weight="600" fill="#9A8E7A" letter-spacing="1">EXAMPLE</text>
      <rect x="16" y="146" width="300" height="6.5" rx="3" fill="#875A2F" opacity="0.7"/>
      <rect x="16" y="158" width="250" height="6.5" rx="3" fill="#875A2F" opacity="0.5"/>

      <!-- SRS footer -->
      <rect x="16" y="180" width="328" height="36" rx="9" fill="#EDF3EB"/>
      <text x="30" y="203" font-size="12" font-weight="600" fill="#4E7A4A">SRS · next review in 2 days</text>
      <rect x="270" y="188" width="60" height="20" rx="10" fill="#4E7A4A"/><text x="300" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF8EE">Good</text>
    </g>

    <!-- vocab list -->
    <g transform="translate(20,320)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#9A8E7A" letter-spacing="1">RECENTLY SAVED · 8</text>
      <g font-size="13">
        <rect y="12" width="360" height="40" rx="9" fill="#FFFFFF" stroke="#E8DECC"/>
        <text x="14" y="36" font-weight="600" fill="#2B2620">semantic</text>
        <rect x="306" y="22" width="40" height="18" rx="9" fill="#EAF1FB"/><text x="326" y="35" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2B5FA8">adj</text>

        <rect y="58" width="360" height="40" rx="9" fill="#F8F0E2"/>
        <text x="14" y="82" font-weight="600" fill="#2B2620">drift</text>
        <rect x="306" y="68" width="40" height="18" rx="9" fill="#FBF0E4"/><text x="326" y="81" text-anchor="middle" font-size="9.5" font-weight="700" fill="#A85E1E">v/n</text>

        <rect y="104" width="360" height="40" rx="9" fill="#FFFFFF" stroke="#E8DECC"/>
        <text x="14" y="128" font-weight="600" fill="#2B2620">inflection</text>
        <rect x="306" y="114" width="40" height="18" rx="9" fill="#EAF1FB"/><text x="326" y="127" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2B5FA8">noun</text>

        <rect y="150" width="360" height="40" rx="9" fill="#FFFFFF" stroke="#E8DECC"/>
        <text x="14" y="174" font-weight="600" fill="#2B2620">cognate</text>
        <rect x="306" y="160" width="40" height="18" rx="9" fill="#EAF1FB"/><text x="326" y="173" text-anchor="middle" font-size="9.5" font-weight="700" fill="#2B5FA8">noun</text>
      </g>
    </g>
  </g>

  <!-- caption -->
  <g transform="translate(40,748)">
    <rect width="404" height="36" rx="18" fill="#2B2620"/>
    <use href="#spark" x="16" y="8" width="20" height="20"/>
    <text x="46" y="23" font-size="13.5" font-weight="600" fill="#FFF8EE">Selection toolbar · vocab &amp; SRS review cards</text>
  </g>
</svg>
