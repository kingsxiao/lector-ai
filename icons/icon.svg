<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Brand gradient: warm amber-brown, lit from top-left (app accent family). -->
    <linearGradient id="bg" x1="10" y1="6" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B07A42"/>
      <stop offset="0.45" stop-color="#96652F"/>
      <stop offset="1" stop-color="#66431D"/>
    </linearGradient>

    <!-- Top-left key light: gives the tile depth without noise. -->
    <radialGradient id="glow" cx="38" cy="30" r="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9C4" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFE9C4" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFE9C4" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom-right shade for a grounded base. -->
    <radialGradient id="shade" cx="100" cy="112" r="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4A2E12" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4A2E12" stop-opacity="0"/>
    </radialGradient>

    <!-- Letterform fill: warm paper white, lit from above. -->
    <linearGradient id="lfill" x1="0" y1="28" x2="0" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#FFF3E2"/>
    </linearGradient>

    <!-- Sparkle with a soft halo behind it. -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6E0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF6E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spark" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFEFD2"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#glow)"/>
  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#shade)"/>
  <!-- Hairline rim to catch the edge on light and dark shelves. -->
  <rect x="5.5" y="5.5" width="117" height="117" rx="27.5" fill="none"
        stroke="#FFF3DC" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Serif "L": stem + foot + bracket serifs (editorial, like the in-app serif). -->
  <g fill="url(#lfill)">
    <!-- stem -->
    <rect x="42" y="28" width="17" height="66" rx="4.5"/>
    <!-- top-left flag serif -->
    <rect x="34" y="28" width="11" height="9" rx="3.5"/>
    <!-- foot -->
    <rect x="42" y="77" width="50" height="17" rx="4.5"/>
    <!-- foot terminal serif (slight bracket, like Georgia's L) -->
    <rect x="84" y="86" width="11" height="9" rx="3.5"/>
  </g>

  <!-- Two quiet text lines: a paragraph being read. -->
  <rect x="67" y="47" width="31" height="5.5" rx="2.75" fill="#FFF6E6" fill-opacity="0.34"/>
  <rect x="67" y="58" width="22" height="5.5" rx="2.75" fill="#FFF6E6" fill-opacity="0.22"/>

  <!-- AI sparkle: one crisp star with halo, top-right. -->
  <circle cx="88" cy="34" r="17" fill="url(#halo)"/>
  <path d="M88 20 C89.9 28.4 93.6 32.1 102 34 C93.6 35.9 89.9 39.6 88 48 C86.1 39.6 82.4 35.9 74 34 C82.4 32.1 86.1 28.4 88 20 Z"
        fill="url(#spark)"/>
</svg>
