<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Simplified variant for 16px: bold L only, no sparkles, no text lines.
       Strokes widened so the letter holds up at 16px. -->
  <defs>
    <linearGradient id="bg" x1="10" y1="6" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B07A42"/>
      <stop offset="0.45" stop-color="#96652F"/>
      <stop offset="1" stop-color="#66431D"/>
    </linearGradient>
    <radialGradient id="glow" cx="38" cy="30" r="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE9C4" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#FFE9C4" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFE9C4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#glow)"/>

  <!-- Wider, simpler L optimized for 16px legibility -->
  <g fill="#FFFDF6">
    <rect x="38" y="26" width="22" height="72" rx="5"/>
    <rect x="38" y="81" width="56" height="17" rx="5"/>
  </g>
</svg>
